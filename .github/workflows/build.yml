name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/
          retention-days: 1

      - name: Upload APK as Release Asset
        if: success() && contains(github.event.head_commit.message, '[Releases]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_id }}"
          gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" app/build/outputs/apk/debug/*.apk --clobber
